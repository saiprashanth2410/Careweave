<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="-60" y1="-100" x2="60" y2="100"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0c6b6d"/></linearGradient>
    <linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="100" y1="-60" x2="-100" y2="60"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
  </defs>
  <rect width="600" height="600" fill="#f6f7f3"/>
  <g transform="translate(300 220)" fill="none" stroke-linecap="butt">
    <rect x="-38" y="-100" width="76" height="200" rx="38" stroke="url(#g1)" stroke-width="22"/>
    <rect x="-100" y="-38" width="200" height="76" rx="38" stroke="url(#g2)" stroke-width="22"/>
    <!-- vertical loop passes over the horizontal one at top-right and bottom-left -->
    <path d="M38 -62 V-14" stroke="#f6f7f3" stroke-width="30"/>
    <path d="M38 -58 V-18" stroke="url(#g1)" stroke-width="22"/>
    <path d="M-38 14 V62" stroke="#f6f7f3" stroke-width="30"/>
    <path d="M-38 18 V58" stroke="url(#g1)" stroke-width="22"/>
  </g>
  <text x="300" y="450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#14231f" letter-spacing="-1">CareWeave</text>
  <text x="300" y="492" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#56655f" letter-spacing="4">UNIFIED RECORDS</text>
